  </filter>
  <filter id="fuzz" x="-8%" y="-8%" width="116%" height="116%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
  <filter id="shad" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>
