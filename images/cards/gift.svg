<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eaf3fb"/>
    <stop offset="55%" stop-color="#d4e7f6"/>
    <stop offset="100%" stop-color="#dcefe6"/>
  </linearGradient>
  <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f8ead0"/>
    <stop offset="50%" stop-color="#fbf6ea"/>
    <stop offset="100%" stop-color="#e8dcc0"/>
  </linearGradient>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6e86b4"/>
    <stop offset="100%" stop-color="#c9d6ee"/>
  </linearGradient>
  <linearGradient id="skyStudio" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4f0e6"/>
    <stop offset="100%" stop-color="#e7efe6"/>
  </linearGradient>
  <linearGradient id="skyPeach" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f8e6dc"/>
    <stop offset="100%" stop-color="#f3efe4"/>
  </linearGradient>
  <linearGradient id="skyWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#cfe8f6"/>
    <stop offset="70%" stop-color="#b7ddea"/>
    <stop offset="100%" stop-color="#dcefe4"/>
  </linearGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f3c9a0"/>
    <stop offset="55%" stop-color="#f6dfc0"/>
    <stop offset="100%" stop-color="#c9d6b0"/>
  </linearGradient>
  <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="fuzz" x="-8%" y="-8%" width="116%" height="116%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
  <filter id="shad" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>
<rect x="0" y="0" width="800" height="600" fill="url(#skyPeach)"/>
<ellipse cx="180" cy="90" rx="240" ry="140" fill="#fbe8e0" opacity=".7" filter="url(#wash)"/>
<ellipse cx="650" cy="200" rx="200" ry="150" fill="#f0dcc8" opacity=".45" filter="url(#wash)"/>
<ellipse cx="400" cy="540" rx="380" ry="140" fill="#e8d4c0" opacity=".4" filter="url(#wash)"/>
<rect x="0" y="0" width="800" height="600" fill="none" stroke="#e6d8c4" stroke-width="18" opacity=".35"/>
<ellipse cx="400" cy="530" rx="170" ry="18" fill="#6a503c" opacity=".28" filter="url(#shad)"/>
<rect x="200" y="250" width="400" height="260" fill="#6aa4d8" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" rx="12"/>
<rect x="180" y="200" width="440" height="80" fill="#4a86c0" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" rx="10"/>
<rect x="370" y="200" width="60" height="310" fill="#e05a55"/>
<rect x="180" y="270" width="440" height="50" fill="#e05a55"/>
<path d="M 400 200 C 300 80 250 200 400 220 C 550 200 500 80 400 200 Z" fill="#e05a55" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="400" cy="210" r="18" fill="#c44a4a" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
