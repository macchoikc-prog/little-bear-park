<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eaf3fb"/>
    <stop offset="55%" stop-color="#d4e7f6"/>
    <stop offset="100%" stop-color="#dcefe6"/>
  </linearGradient>
  <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f8ead0"/>
    <stop offset="50%" stop-color="#fbf6ea"/>
    <stop offset="100%" stop-color="#e8dcc0"/>
  </linearGradient>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6e86b4"/>
    <stop offset="100%" stop-color="#c9d6ee"/>
  </linearGradient>
  <linearGradient id="skyStudio" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f4f0e6"/>
    <stop offset="100%" stop-color="#e7efe6"/>
  </linearGradient>
  <linearGradient id="skyPeach" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f8e6dc"/>
    <stop offset="100%" stop-color="#f3efe4"/>
  </linearGradient>
  <linearGradient id="skyWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#cfe8f6"/>
    <stop offset="70%" stop-color="#b7ddea"/>
    <stop offset="100%" stop-color="#dcefe4"/>
  </linearGradient>
  <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f3c9a0"/>
    <stop offset="55%" stop-color="#f6dfc0"/>
    <stop offset="100%" stop-color="#c9d6b0"/>
  </linearGradient>
  <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="fuzz" x="-8%" y="-8%" width="116%" height="116%">
    <feGaussianBlur stdDeviation="1.1"/>
  </filter>
  <filter id="shad" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="10"/>
  </filter>
</defs>
<rect x="0" y="0" width="800" height="600" fill="url(#skyDay)"/>
<ellipse cx="180" cy="70" rx="250" ry="130" fill="#ffffff" opacity=".5" filter="url(#wash)"/>
<ellipse cx="640" cy="120" rx="230" ry="150" fill="#c5dff0" opacity=".45" filter="url(#wash)"/>
<ellipse cx="400" cy="540" rx="420" ry="160" fill="#c8e0c0" opacity=".4" filter="url(#wash)"/>
<rect x="0" y="0" width="800" height="600" fill="none" stroke="#e6d8c4" stroke-width="18" opacity=".35"/>
<ellipse cx="400" cy="530" rx="230" ry="16" fill="#6a503c" opacity=".28" filter="url(#shad)"/>
<path d="M-20 500 C 160 430 300 470 400 460 C 560 445 680 490 820 480 L 820 620 L -20 620 Z" fill="#b9d8c3" opacity=".9" filter="url(#fuzz)"/>
<path d="M 180 180 L 220 180 L 220 260 L 420 460 L 360 470 L 180 280 Z" fill="#e05a55" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="160" y="140" width="80" height="50" fill="#6aa4d8" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" rx="8"/>
<line x1="180" y1="180" x2="180" y2="500" stroke="#c8c4bc" stroke-width="10" stroke-linecap="round"/>
<line x1="220" y1="180" x2="220" y2="300" stroke="#c8c4bc" stroke-width="10" stroke-linecap="round"/>
<path d="M 500 160 L 500 480 M 700 160 L 700 480 M 480 160 L 720 160" fill="none" stroke="#8a6a4e" stroke-width="12" stroke-linecap="round"/>
<line x1="560" y1="160" x2="560" y2="380" stroke="#8a6a4e" stroke-width="4" stroke-linecap="round"/>
<line x1="640" y1="160" x2="640" y2="380" stroke="#8a6a4e" stroke-width="4" stroke-linecap="round"/>
<rect x="545" y="375" width="110" height="16" fill="#c48a50" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" rx="4"/>
<ellipse cx="300" cy="500" rx="160" ry="24" fill="#e8d0a0" opacity=".7"/>
