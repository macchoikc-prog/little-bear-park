<path d="M 130 350 Q 400 400 670 350 L 670 430 L 130 430 Z" fill="#8eb8e8" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 130 350 Q 400 380 670 350" fill="none" stroke="#6a98c8" stroke-width="4" opacity=".4"/>
<ellipse cx="250" cy="300" rx="90" ry="40" fill="#fffdf8" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="400" cy="295" rx="80" ry="36" fill="#fffdf8" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 120 300 Q 120 200 220 200 L 220 320 L 120 320 Z" fill="#c48a50" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 680 300 Q 680 200 580 200 L 580 320 L 680 320 Z" fill="#c48a50" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
