<path d="M 620 80 C 560 80 540 160 580 220 C 620 270 700 250 710 180 C 720 110 680 80 620 80 Z" fill="#f2a0b6" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
