<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eaf3fb"/>
    <stop offset="55%" stop-color="#d4e7f6"/>
    <stop offset="100%" stop-color="#dcefe6"/>
  </linearGradient>
  <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f8ead0"/>
    <stop offset="50%" stop-color="#fbf6ea"/>
    <stop offset="100%" stop-color="#e8dcc0"/>
  </linearGradient>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
