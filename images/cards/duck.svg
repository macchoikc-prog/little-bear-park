<ellipse cx="450" cy="390" rx="60" ry="40" fill="#efc44a" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 520 360 C 570 340 580 390 530 400 Z" fill="#efc44a" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="300" cy="270" r="80" fill="#f6d45a" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="220" cy="285" rx="48" ry="22" fill="#ef9a4a" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="190" y1="285" x2="250" y2="285" stroke="#d47830" stroke-width="2" stroke-linecap="round" opacity=".5"/>
<circle cx="285" cy="250" r="9" fill="#6a503c"/>
<circle cx="288" cy="247" r="3.2" fill="#fff"/>
