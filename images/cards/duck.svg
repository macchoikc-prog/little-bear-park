<ellipse cx="400" cy="540" rx="420" ry="160" fill="#9fcfbb" opacity=".35" filter="url(#wash)"/>
<rect x="0" y="0" width="800" height="600" fill="none" stroke="#e6d8c4" stroke-width="18" opacity=".35"/>
<ellipse cx="400" cy="505" rx="160" ry="22" fill="#6a503c" opacity=".28" filter="url(#shad)"/>
<ellipse cx="400" cy="500" rx="260" ry="36" fill="#8ec6e0" opacity=".55" filter="url(#soft)"/>
<ellipse cx="400" cy="508" rx="200" ry="18" fill="#5ea0c4" opacity=".25" filter="url(#soft)"/>
<ellipse cx="400" cy="390" rx="140" ry="100" fill="#f6d45a" stroke="#8a6a4e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
