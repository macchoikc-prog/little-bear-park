<ellipse cx="400" cy="520" rx="200" ry="18" fill="#6a503c" opacity=".28" filter="url(#shad)"/>
<path d="M-20 515 C 160 445 300 485 400 475 C 560 460 680 505 820 495 L 820 620 L -20 620 Z" fill="#b9d8c3" opacity=".9" filter="url(#fuzz)"/>
