    smile: { d: "M30 60 Q50 74 70 60", fill: "none" },
    round: { d: "M50 70 m-8 -2 a8 9 0 1 1 16 0 a8 9 0 1 1 -16 0", fill: "#3b2a1a" },
    tight: { d: "M50 70 m-5 -1 a5 6 0 1 1 10 0 a5 6 0 1 1 -10 0", fill: "#3b2a1a" }
  };

  const state = {
    index: 0,
    mode: null,
    bookLang: "yue",
    echoPhase: "listen",
    playing: null,
    popped: null,
    micStatus: "off",
    level: 0,
    hasClip: false,
    label: null,
    activeWord: -1,
    wordPop: -1,
    wordTip: -1,
    mouth: "rest"
  };

  const refs = {
    gen: 0,
    swiped: false,
    touchX: null,
    stream: null,
    analyser: null,
    audioCtx: null,
    recorder: null,
    chunks: [],
    url: null,
    clip: null,
    raf: 0,
    finishing: false,
    micPromise: null,
    wordTimers: [],
    mouthTimer: 0,
    tipTimer: 0
  };

  function isEn() { return state.bookLang === "en"; }
  function txt(yue, en) { return isEn() ? en : yue; }
  function pageTokens(page) {
    return isEn() ? page.wordsEn : page.wordsZh;
  }
  function isPunct(tok) { return !tok || !tok.s || !tok.t; }
  function joinSpeak(tokens) {
    let out = "";
    tokens.forEach((tok) => {
      if (!tok.s) return;
      const punct = /^[，。！、：；,.!?「」]+$/.test(tok.s);
      if (!out || punct) out += tok.s;
      else if (isEn()) out += " " + tok.s;
      else out += tok.s;
    });
    return out;
  }
  function tokenStarts(tokens) {
    const text = joinSpeak(tokens);
    const starts = [];
    let cursor = 0;
    tokens.forEach((tok) => {
      if (!tok.s) { starts.push(-1); return; }
      const idx = text.indexOf(tok.s, cursor);
      starts.push(idx < 0 ? cursor : idx);
      cursor = (idx < 0 ? cursor : idx) + tok.s.length;
    });
    return starts;
  }
  function tokenAtChar(tokens, starts, charIndex) {
    let hit = 0;
    for (let i = 0; i < tokens.length; i++) {
      if (starts[i] >= 0 && starts[i] <= charIndex) hit = i;
    }
    return hit;
  }
  function tokenDuration(tok, rate) {
    if (isPunct(tok)) return 80 / rate;
    const s = tok.s;
    const en = /[a-zA-Z]/.test(s);
    const base = en ? Math.max(280, s.replace(/[^a-zA-Z]/g, "").length * 70) : Math.max(280, Array.from(s).length * 340);
    return base / rate;
  }

  function findVoice(prefs, nameHints) {
    if (typeof speechSynthesis === "undefined") return null;
    const voices = speechSynthesis.getVoices();
    for (const pref of prefs) {
      const hit = voices.find((v) => v.lang.toLowerCase().replace("_", "-").startsWith(pref));
      if (hit) return hit;
    }
    for (const hint of nameHints) {
      const hit = voices.find((v) => v.name.toLowerCase().includes(hint));
      if (hit) return hit;
    }
    return null;
  }

  function speakText(text, lang, rate, onDone, onBoundary) {
    if (typeof speechSynthesis === "undefined") { onDone(); return; }
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = rate;
    utter.pitch = 1.05;
    if (lang === "yue") {
      utter.lang = "zh-HK";
      const voice = findVoice(["zh-hk", "yue-hk", "yue", "zh-tw"], ["sinji", "meijia", "yunjie", "cantonese", "yue", "hong kong"]);
      if (voice) utter.voice = voice;
    } else {
      utter.lang = "en-GB";
      const voice = findVoice(["en-gb", "en-us", "en-au", "en"], ["samantha", "daniel", "karen"]);
      if (voice) utter.voice = voice;
    }
    if (onBoundary) utter.onboundary = onBoundary;
    utter.onend = onDone;
    utter.onerror = onDone;
    speechSynthesis.speak(utter);
  }

  function pickMime() {
    if (typeof MediaRecorder === "undefined") return "";
    const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg", "audio/aac"];
    for (const t of types) { if (MediaRecorder.isTypeSupported(t)) return t; }
    return "";
  }

  function set(partial, shouldRender) {
    Object.assign(state, partial);
    if (shouldRender !== false) render();
  }

  function clearWordTimers() {
    refs.wordTimers.forEach(clearTimeout);
    refs.wordTimers = [];
    if (refs.mouthTimer) { clearInterval(refs.mouthTimer); refs.mouthTimer = 0; }
  }

  function applyMouth(shape) {
    state.mouth = MOUTH[shape] ? shape : "rest";
    const lip = document.getElementById("lips");
    if (!lip) return;
    const m = MOUTH[state.mouth];
    lip.setAttribute("d", m.d);
    lip.setAttribute("fill", m.fill);
    lip.setAttribute("stroke", m.fill === "none" ? "#3b2a1a" : "none");
  }

  function startMouth(shapes) {
    if (refs.mouthTimer) { clearInterval(refs.mouthTimer); refs.mouthTimer = 0; }
    const list = (shapes && shapes.length) ? shapes : ["mid"];
    let i = 0;
    applyMouth(list[0]);
    if (list.length > 1) {
      refs.mouthTimer = setInterval(() => {
        i = (i + 1) % list.length;
        applyMouth(list[i]);
      }, 150);
    }
  }

  function setActiveWord(index, withTip) {
    state.activeWord = index;
    if (withTip) state.wordTip = index;
    const tokens = pageTokens(pages[state.index]);
    const tok = tokens[index];
    if (tok && tok.m) startMouth(tok.m);
    else applyMouth("rest");
    syncWords();
  }

  function clearWordUi(shouldRender) {
    clearWordTimers();
    state.activeWord = -1;
    state.wordPop = -1;
    state.wordTip = -1;
    applyMouth("rest");
    if (shouldRender === false) syncWords();
  }

  function stopClipAudio() {
    if (refs.clip) {
      try { refs.clip.pause(); } catch (e) {}
      refs.clip = null;
    }
  }

  function stopListenLoop() {
    if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
  }

  function stopTracks() {
    if (refs.stream) {
      refs.stream.getTracks().forEach((t) => t.stop());
      refs.stream = null;
    }
    refs.analyser = null;
    if (refs.audioCtx) { try { refs.audioCtx.close(); } catch (e) {} refs.audioCtx = null; }
  }

  function clearClip() {
    stopClipAudio();
    if (refs.url) { URL.revokeObjectURL(refs.url); refs.url = null; }
    refs.chunks = [];
    state.hasClip = false;
  }

  function stopSpeak() {
    refs.gen += 1;
    if (typeof speechSynthesis !== "undefined") speechSynthesis.cancel();
    stopClipAudio();
    clearWordTimers();
    set({ playing: null }, false);
  }

  function speak(lang, text, rate, onDone, tokens, baseIndex) {
    const gen = ++refs.gen;
    stopClipAudio();
    clearWordTimers();
    const list = tokens || null;
    const offset = baseIndex || 0;
    set({ playing: lang });
    if (list && list.length) {
      const starts = tokenStarts(list);
      const first = list.findIndex((t) => !isPunct(t));
      if (first >= 0) setActiveWord(offset + first, false);
      let t = 0;
      list.forEach((tok, i) => {
        const delay = t;
        refs.wordTimers.push(setTimeout(() => {
          if (refs.gen !== gen) return;
          setActiveWord(offset + i, false);
        }, delay));
        t += tokenDuration(tok, rate);
      });
      speakText(text, lang, rate, () => {
        if (refs.gen !== gen) return;
        clearWordUi(false);
        set({ playing: null });
        if (onDone) onDone();
      }, (e) => {
        if (refs.gen !== gen) return;
        if (e.name && e.name !== "word") return;
        const i = tokenAtChar(list, starts, e.charIndex || 0);
        setActiveWord(offset + i, false);
      });
    } else {
      speakText(text, lang, rate, () => {
        if (refs.gen !== gen) return;
        set({ playing: null });
        if (onDone) onDone();
      });
    }
  }

  function speakPage(rate, onDone) {
    const page = pages[state.index];
    const tokens = pageTokens(page);
    const text = joinSpeak(tokens) || (isEn() ? page.enSpeak : page.yue);
    speak(state.bookLang, text, rate, onDone, tokens);
  }

  function recordingNow() {
    return state.mode === "echo" && (state.echoPhase === "repeat" || state.echoPhase === "replay");
  }

  function onWordTap(index) {
    const tokens = pageTokens(pages[state.index]);
    const tok = tokens[index];
    if (!tok || isPunct(tok)) return;
    state.wordPop = index;
    state.wordTip = index;
    setActiveWord(index, true);
    if (refs.tipTimer) clearTimeout(refs.tipTimer);
    refs.tipTimer = setTimeout(() => {
      if (state.wordPop === index) state.wordPop = -1;
      if (state.playing !== state.bookLang && state.wordTip === index) {
        state.wordTip = -1;
        if (state.activeWord === index) state.activeWord = -1;
        applyMouth("rest");
      }
      syncWords();
    }, 1600);
    if (recordingNow()) return;
    speak(state.bookLang, tok.s, 0.95, () => {
      if (state.wordTip === index) return;
      clearWordUi(false);
    }, [tok], index);
  }

  function playClip(onDone) {
    const url = refs.url;
    if (!url) { if (onDone) onDone(); return; }
    const gen = ++refs.gen;
    if (typeof speechSynthesis !== "undefined") speechSynthesis.cancel();
    stopClipAudio();
    clearWordTimers();
    set({ playing: "clip" });
    const audio = new Audio(url);
    refs.clip = audio;
    const done = () => {
      if (refs.gen !== gen) return;
      set({ playing: null });
      if (onDone) onDone();
    };
    audio.onended = done;
    audio.onerror = done;
    audio.play().catch(done);
  }

  async function ensureMic() {
    if (refs.stream && refs.analyser) {
      set({ micStatus: "on" });
      return true;
    }
    if (refs.micPromise) return refs.micPromise;
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      set({ micStatus: "denied" });
      return false;
    }
    const run = (async () => {
      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
            video: false
          });
        } catch (e1) {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        }
        refs.stream = stream;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        if (ctx.state === "suspended") await ctx.resume();
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);
        refs.audioCtx = ctx;
        refs.analyser = analyser;
        set({ micStatus: "on" });
        return true;
      } catch (e) {
        refs.stream = null;
        set({ micStatus: "denied" });
        return false;
      }
    })();
    refs.micPromise = run;
    const ok = await run;
    if (!ok) refs.micPromise = null;
    return ok;
  }

  function startRepeatListen() {
    refs.finishing = false;
    if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
    const stream = refs.stream;
    const analyser = refs.analyser;
    if (!stream || !analyser) return;
    refs.chunks = [];
    if (typeof MediaRecorder !== "undefined") {
      try {
        const mime = pickMime();
        const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) refs.chunks.push(e.data); };
        rec.start(200);
        refs.recorder = rec;
      } catch (e) { refs.recorder = null; }
    }
    const data = new Uint8Array(analyser.fftSize);
    const t0 = performance.now();
    let noiseSum = 0, noiseCount = 0, threshold = 0.05, calibrated = false;
    let speechStart = 0, spoken = false, lastLoud = t0, lastUi = 0;
    const tick = (now) => {
      if (refs.finishing) return;
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / data.length);
      if (now - lastUi > 50) {
        state.level = Math.min(1, rms * 6);
        lastUi = now;
        updateWave();
      }
      if (!calibrated) {
        if (now - t0 < 450) { noiseSum += rms; noiseCount += 1; refs.raf = requestAnimationFrame(tick); return; }
        const floor = noiseCount ? noiseSum / noiseCount : 0.02;
        threshold = Math.max(0.05, floor * 3.2);
        calibrated = true;
      }
      if (rms > threshold) {
        lastLoud = now;
        if (speechStart === 0) speechStart = now;
        if (now - speechStart >= 400) spoken = true;
      } else if (!spoken && now - lastLoud > 300) {
        speechStart = 0;
      }
      if (spoken && now - lastLoud >= 1500) { void finishRepeat(); return; }
      if (spoken && now - t0 >= 10000) { void finishRepeat(); return; }
      refs.raf = requestAnimationFrame(tick);
    };
    refs.raf = requestAnimationFrame(tick);
  }

  function stopRecorder() {
    return new Promise((resolve) => {
      const rec = refs.recorder;
      refs.recorder = null;
      if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
      set({ level: 0 }, false);
      updateWave();
      if (!rec || rec.state === "inactive") { resolve(refs.url); return; }
      rec.onstop = () => {
        const blob = new Blob(refs.chunks, { type: rec.mimeType || "audio/webm" });
        if (refs.url) URL.revokeObjectURL(refs.url);
        if (blob.size > 800) {
          const url = URL.createObjectURL(blob);
          refs.url = url;
          set({ hasClip: true }, false);
          resolve(url);
        } else {
          refs.url = null;
          set({ hasClip: false }, false);
          resolve(null);
        }
      };
      try { rec.stop(); } catch (e) { resolve(null); }
    });
  }

  async function finishRepeat() {
    if (refs.finishing) return;
    refs.finishing = true;
    const url = await stopRecorder();
    const lang = state.bookLang;
    if (url) {
      set({ echoPhase: "replay" });
      playClip(() => {
        set({ echoPhase: "praise" });
        speak(lang, lang === "yue" ? "好棒！" : "Great job!", 0.95);
      });
    } else {
      set({ echoPhase: "praise" });
      speak(lang, lang === "yue" ? "好棒！" : "Great job!", 0.95);
    }
  }

  function beginEchoPage(pageIndex) {
    refs.finishing = true;
    if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
    clearClip();
    clearWordUi(false);
    set({ echoPhase: "listen", level: 0, hasClip: false });
    speakPage(0.8, () => {
      set({ echoPhase: "repeat" });
      startRepeatListen();
    });
  }

  function go(next) {
    const started = state.mode !== null;
    const target = Math.max(started ? 1 : 0, Math.min(pages.length - 1, next));
    if (target === state.index) return;
    refs.finishing = true;
    if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
    clearWordUi(false);
    set({ index: target, popped: null, label: null });
    const nextPage = pages[target];
    if (state.mode === "listen" && !nextPage.cover) {
      speakPage(0.88);
    } else if (state.mode === "echo" && !nextPage.cover) {
      beginEchoPage(target);
    } else {
      stopSpeak();
      render();
    }
  }

  async function startBook(nextMode) {
    refs.finishing = true;
    if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
    clearClip();
    clearWordUi(false);
    set({ mode: nextMode, index: 1, popped: null, label: null, echoPhase: "listen", hasClip: false });
    if (nextMode === "listen") {
      stopTracks();
      set({ micStatus: "off" }, false);
      speakPage(0.88);
    } else {
      await ensureMic();
      beginEchoPage(1);
    }
  }

  function goCover() {
    refs.finishing = true;
    stopSpeak();
    stopListenLoop();
    stopTracks();
    clearClip();
    clearWordUi(false);
    set({ mode: null, index: 0, echoPhase: "listen", micStatus: "off", popped: null, label: null, hasClip: false });
  }

  function setBookLang(lang) {
    if (state.mode !== null) return;
    document.documentElement.lang = lang === "en" ? "en" : "zh-HK";
    set({ bookLang: lang });
  }

  function replayModel() {
    if (state.mode === "echo") beginEchoPage(state.index);
    else speakPage(0.88);
  }

  async function retryMic() {
    refs.micPromise = null;
    stopTracks();
    const ok = await ensureMic();
    if (ok && state.mode === "echo" && state.echoPhase === "repeat") startRepeatListen();
    render();
  }

  function popSpot(id) {
    set({ popped: id });
    setTimeout(() => { if (state.popped === id) set({ popped: null }); }, 700);
  }

  function onSpotClick(spot) {
    popSpot(spot.id);
    const lang = state.bookLang;
    set({ label: { id: spot.id, text: lang === "yue" ? spot.yue : spot.en } });
    setTimeout(() => { if (state.label && state.label.id === spot.id) set({ label: null }); }, 1100);
    if (state.mode === "echo" && (state.echoPhase === "listen" || state.echoPhase === "repeat" || state.echoPhase === "replay")) return;
    speak(lang, lang === "yue" ? spot.yue : spot.en, 0.95);
  }

  function onStageClick() {
    if (refs.swiped) { refs.swiped = false; return; }
    const el = document.getElementById("stage");
    if (el && el.animate) {
      el.animate([{ transform: "scale(1)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
    }
    if (state.mode === "echo" && (state.echoPhase === "listen" || state.echoPhase === "repeat" || state.echoPhase === "replay")) return;
    speakPage(0.95);
  }

  function updateWave() {
    const root = document.getElementById("wave");
    if (!root) return;
    const bars = root.querySelectorAll("span");
    bars.forEach((el, i) => {
      const h = waveScale[i];
      el.style.height = Math.max(8, Math.round(8 + h * state.level * 28)) + "px";
    });
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }

  function overlayHTML(page) {
    let fx = "";
    if (page.fx === "petals") {
      fx = petals.map((p) => `<span class="petal" style="left:${p.left}%;width:${p.size}px;height:${p.size}px;background:${p.color};animation-delay:${p.delay}ms"></span>`).join("");
    } else if (page.fx === "stars") {
      fx = stars.map((s) => `<span class="star" style="left:${s.left}%;top:${s.top}%;width:${s.size}px;height:${s.size}px;animation-delay:${s.delay}ms"></span>`).join("");
    } else if (page.fx === "sun") {
      fx = `<span class="sun"></span>`;
    }
    const spots = page.spots.map((spot) => {
      const motion = spot.motion ? spot.motion : "";
      const hint = spot.hint !== false ? `<span class="hint"></span>` : "";
      return `<button type="button" class="spot ${motion}" data-spot="${esc(spot.id)}" aria-label="${esc(spot.yue)}" style="left:${spot.left}%;top:${spot.top}%;width:${spot.width}%;height:${spot.height}%;">${hint}</button>`;
    }).join("");
    return `<div id="overlays">${fx}${spots}</div><div id="sparks"></div>`;
  }

  function syncSpotUi() {
    const stage = document.getElementById("stage");
    if (!stage) return;
    stage.querySelectorAll("[data-spot]").forEach((btn) => {
      const id = btn.getAttribute("data-spot");
      btn.classList.toggle("pop", state.popped === id);
      let tag = btn.querySelector(".nametag");
      if (state.label && state.label.id === id) {
        if (!tag) {
          tag = document.createElement("span");
          tag.className = "nametag";
          btn.appendChild(tag);
        }
        tag.textContent = state.label.text;
      } else if (tag) {
        tag.remove();
      }
    });
    const page = pages[state.index];
    const wantSparks = state.echoPhase === "praise" && state.mode === "echo" && !page.cover;
    let sparks = document.getElementById("sparks");
    if (!sparks) return;
    const html = wantSparks
      ? [0,1,2,3,4].map((i) => `<span class="spark" style="left:${18 + i * 16}%;top:${10 + (i % 2) * 8}%;width:12px;height:12px;animation-delay:${i * 180}ms"></span>`).join("")
      : "";
    if (sparks.innerHTML !== html) sparks.innerHTML = html;
  }

  function syncWords() {
    const root = document.getElementById("words");
    if (root) {
      root.querySelectorAll("[data-word]").forEach((btn) => {
        const i = Number(btn.getAttribute("data-word"));
        btn.classList.toggle("on", state.activeWord === i);
        btn.classList.toggle("pop", state.wordPop === i);
      });
    }
    const dock = document.getElementById("word-dock");
    if (!dock) return;
    const tokens = pageTokens(pages[state.index]);
    const tip = state.wordTip >= 0 ? tokens[state.wordTip] : (state.activeWord >= 0 ? tokens[state.activeWord] : null);
    const show = tip && tip.t && (state.wordTip >= 0 || state.playing === state.bookLang);
    const face = dock.querySelector(".mouth-face");
    const trans = dock.querySelector(".mouth-trans");
    if (face) face.hidden = !show;
    if (trans) {
      trans.hidden = !(show && state.wordTip >= 0 && tip.t);
      trans.textContent = (show && state.wordTip >= 0 && tip.t) ? tip.t : "";
    }
    applyMouth(show ? state.mouth : "rest");
  }

  function wordsHTML(page) {
    const tokens = pageTokens(page);
    const words = tokens.map((tok, i) => {
      if (isPunct(tok)) return `<span class="punct">${esc(tok.d)}</span>`;
      const on = state.activeWord === i ? " on" : "";
      const pop = state.wordPop === i ? " pop" : "";
      return `<button type="button" class="word${on}${pop}" data-word="${i}">${esc(tok.d)}</button>`;
    }).join("");
    const tip = state.wordTip >= 0 ? tokens[state.wordTip] : null;
    const showFace = (tip && tip.t) || (state.activeWord >= 0 && state.playing === state.bookLang);
    const m = MOUTH[state.mouth] || MOUTH.rest;
    return `<div class="words" id="words">${words}</div>
      <div class="word-dock" id="word-dock">
        <div class="mouth-face" ${showFace ? "" : "hidden"} aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" fill="#ffe8b0" stroke="#3b2a1a" stroke-width="3"></circle>
            <circle cx="35" cy="40" r="5" fill="#3b2a1a"></circle>
            <circle cx="65" cy="40" r="5" fill="#3b2a1a"></circle>
            <path id="lips" d="${m.d}" fill="${m.fill}" stroke="${m.fill === "none" ? "#3b2a1a" : "none"}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div class="mouth-trans" ${tip && tip.t ? "" : "hidden"}>${tip && tip.t ? esc(tip.t) : ""}</div>
      </div>`;
  }

  function panelHTML() {
    const page = pages[state.index];
    const onCover = !!page.cover;
    const last = state.index === pages.length - 1;

    if (onCover) {
      return `<div class="center">
        <div class="title">小熊去公園</div>
        <div class="sub">Little Bear Goes to the Park</div>
        <div class="hint-text">${txt("先揀語言", "Choose a language first")}</div>
        <div class="row">
          <button type="button" class="btn${state.bookLang === "yue" ? " on" : ""}" data-act="lang-yue" style="flex:1 1 140px;max-width:200px">中文</button>
          <button type="button" class="btn${state.bookLang === "en" ? " on" : ""}" data-act="lang-en" style="flex:1 1 140px;max-width:200px">English</button>
        </div>
        <button type="button" class="btn primary" data-act="listen">${txt("聽故事", "Listen")}</button>
        <button type="button" class="btn teal" data-act="echo">${txt("跟讀", "Read with me")}</button>
      </div>`;
    }

    let phase = "";
    if (state.mode === "echo" && state.echoPhase === "repeat") {
      const wave = state.micStatus === "on"
        ? `<div class="wave" id="wave">${waveScale.map((h) => `<span style="height:${Math.max(8, Math.round(8 + h * state.level * 28))}px"></span>`).join("")}</div>`
        : "";
      let hint;
      if (state.micStatus === "on") hint = txt("讀完會自動聽返你；亦可以撳「我讀完喇」", "I will play it back when you finish. You can also tap “I finished”.");
      else if (!window.isSecureContext) hint = txt("請用 Chrome 打開呢個網頁，先可以開咪高峰。而家可以撳「我讀完喇」。", "Please open this page in Chrome so the microphone can work. You can tap “I finished”.");
      else hint = txt("開唔到咪高峰，讀完請撳「我讀完喇」。亦可撳「再開咪」。", "The microphone is not on. Tap “I finished” when you are done, or “Try mic again”.");
      const retry = state.micStatus !== "on" && window.isSecureContext
        ? `<button type="button" class="btn" data-act="retry-mic" style="min-height:44px;font-size:16px">${txt("再開咪", "Try mic again")}</button>`
        : "";
      phase = `<div class="center" style="gap:8px"><div class="phase">${txt("而家你讀", "Your turn")}</div>${wave}<div class="hint-text">${hint}</div>${retry}</div>`;
    } else if (state.mode === "echo" && state.echoPhase === "replay") {
      phase = `<div class="phase">${txt("聽返你自己", "Listen to you")}</div>`;
    } else if (state.mode === "echo" && state.echoPhase === "praise") {
      phase = `<div class="phase big">${txt("好棒！", "Great job!")}</div>`;
    }

    let actions = "";
    if (state.mode === "listen") {
      actions = `<div class="row">
          <button type="button" class="btn" data-act="replay-model" style="flex:1 1 140px;max-width:200px">${txt("再聽一次", "Listen again")}</button>
        </div>`;
    }
    if (state.mode === "echo" && state.echoPhase === "repeat") {
      actions += `<div class="row">
          <button type="button" class="btn" data-act="replay-model" style="flex:1 1 140px;max-width:200px">${txt("再聽一次", "Listen again")}</button>
          <button type="button" class="btn primary" data-act="done" style="flex:1 1 140px;max-width:220px">${txt("我讀完喇", "I finished")}</button>
        </div>`;
    }
    if (state.mode === "echo" && state.echoPhase === "praise") {
      actions += `<div class="row">
          ${state.hasClip ? `<button type="button" class="btn${state.playing === "clip" ? " on" : ""}" data-act="play-clip" style="flex:1 1 140px;max-width:200px">${txt("聽返自己", "Play my voice")}</button>` : ""}
          <button type="button" class="btn" data-act="replay-model" style="flex:1 1 140px;max-width:200px">${txt("再聽一次", "Listen again")}</button>
          ${last
            ? `<button type="button" class="btn primary" data-act="echo-again" style="flex:1 1 140px;max-width:220px">${txt("再讀一次", "Read again")}</button>`
            : `<button type="button" class="btn primary" data-act="next" style="flex:1 1 140px;max-width:220px">${txt("下一頁", "Next")}</button>`}
        </div>`;
    }
    if (state.mode === "listen" && last) {
      actions += `<div class="row"><button type="button" class="btn primary" data-act="listen-again">${txt("再睇一次", "Start again")}</button></div>`;
    }

    const dots = pages.slice(1).map((_, i) => `<i class="${i + 1 === state.index ? "cur" : ""}"></i>`).join("");
    return `<div class="panel">${phase}${wordsHTML(page)}${actions}
        <div class="row">
          <button type="button" class="btn nav" data-act="prev" ${state.index <= 1 ? "disabled" : ""}>‹</button>
          <div class="dots">${dots}</div>
          <button type="button" class="btn nav" data-act="next" ${last ? "disabled" : ""}>›</button>
        </div>
        <div class="row"><button type="button" class="btn" data-act="cover" style="min-height:44px;font-size:16px">${txt("封面", "Cover")}</button></div>
      </div>`;
  }

  function render() {
    const page = pages[state.index];
    const appEl = document.getElementById("app");
    const stage = document.getElementById("stage");
    const samePage = stage && stage.getAttribute("data-index") === String(state.index);
    const mid = panelHTML();
    appEl.className = page.cover ? "cover" : "reading";

    if (!samePage) {
      const stageHtml = `<div class="stage-wrap enter" id="stage" data-index="${state.index}">
        <img src="${esc(page.img)}" alt="${esc(page.alt)}" draggable="false">
        ${overlayHTML(page)}
      </div>`;
      const panel = document.getElementById("panel");
      if (stage && panel) {
        stage.outerHTML = stageHtml;
        panel.innerHTML = mid;
      } else {
        appEl.innerHTML = `${stageHtml}<div id="panel">${mid}</div>`;
      }
    } else {
      document.getElementById("panel").innerHTML = mid;
    }
    syncSpotUi();
    syncWords();
  }

  const app = document.getElementById("app");
  app.addEventListener("pointerdown", (e) => {
    if (!e.target.closest("#stage")) return;
    refs.swiped = false;
    refs.touchX = e.clientX;
  });
  app.addEventListener("pointerup", (e) => {
    if (refs.touchX == null || state.mode === null) { refs.touchX = null; return; }
    if (!e.target.closest("#stage") && !refs.swiped) { refs.touchX = null; return; }
    const dx = e.clientX - refs.touchX;
    refs.touchX = null;
    if (dx < -50) { refs.swiped = true; go(state.index + 1); }
    else if (dx > 50) { refs.swiped = true; go(state.index - 1); }
  });
  app.addEventListener("click", (e) => {
    const wordBtn = e.target.closest("[data-word]");
    if (wordBtn) {
      onWordTap(Number(wordBtn.getAttribute("data-word")));
      return;
    }
    const spotBtn = e.target.closest("[data-spot]");
    if (spotBtn) {
      e.stopPropagation();
      if (refs.swiped) { refs.swiped = false; return; }
      const spot = pages[state.index].spots.find((s) => s.id === spotBtn.getAttribute("data-spot"));
      if (spot) onSpotClick(spot);
      return;
    }
    if (e.target.closest("#stage")) {
      onStageClick();
      return;
    }
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.getAttribute("data-act");
    if (act === "listen") void startBook("listen");
    else if (act === "echo") void startBook("echo");
    else if (act === "lang-yue") setBookLang("yue");
    else if (act === "lang-en") setBookLang("en");
    else if (act === "replay-model") replayModel();
    else if (act === "done") void finishRepeat();
    else if (act === "play-clip") playClip();
    else if (act === "echo-again") void startBook("echo");
    else if (act === "listen-again") void startBook("listen");
    else if (act === "prev") go(state.index - 1);
    else if (act === "next") go(state.index + 1);
    else if (act === "cover") goCover();
    else if (act === "retry-mic") void retryMic();
  });

  app.addEventListener("pointerdown", (e) => {
    const spotBtn = e.target.closest("[data-spot]");
    if (spotBtn) e.stopPropagation();
  }, true);

  if (typeof speechSynthesis !== "undefined") {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener("voiceschanged", () => { speechSynthesis.getVoices(); });
  }
  render();
})();
  </script>
</body>
</html>
