        if (now - speechStart >= 400) spoken = true;
      } else if (!spoken && now - lastLoud > 300) {
        speechStart = 0;
      }
      if (spoken && now - lastLoud >= 1500) { void finishRepeat(); return; }
      if (spoken && now - t0 >= 10000) { void finishRepeat(); return; }
      refs.raf = requestAnimationFrame(tick);
    };
    refs.raf = requestAnimationFrame(tick);
  }

  function stopRecorder() {
    return new Promise((resolve) => {
      const rec = refs.recorder;
      refs.recorder = null;
      if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
      set({ level: 0 }, false);
      updateWave();
      if (!rec || rec.state === "inactive") { resolve(refs.url); return; }
      rec.onstop = () => {
        const blob = new Blob(refs.chunks, { type: rec.mimeType || "audio/webm" });
        if (refs.url) URL.revokeObjectURL(refs.url);
        if (blob.size > 800) {
          const url = URL.createObjectURL(blob);
          refs.url = url;
          set({ hasClip: true }, false);
          resolve(url);
        } else {
          refs.url = null;
          set({ hasClip: false }, false);
          resolve(null);
        }
      };
      try { rec.stop(); } catch (e) { resolve(null); }
    });
  }

  async function finishRepeat() {
    if (refs.finishing) return;
    refs.finishing = true;
    const url = await stopRecorder();
    const lang = state.echoLang;
    if (url) {
      set({ echoPhase: "replay", secondLine: true });
      playClip(() => {
        set({ echoPhase: "praise", secondLine: true });
        speak(lang, lang === "yue" ? "好棒！" : "Great job!", 0.95);
      });
    } else {
      set({ echoPhase: "praise", secondLine: true });
      speak(lang, lang === "yue" ? "好棒！" : "Great job!", 0.95);
    }
  }

  function beginEchoPage(pageIndex, lang) {
    refs.finishing = true;
    if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
    clearClip();
    set({ echoPhase: "listen", secondLine: false, level: 0, hasClip: false });
    const text = lang === "yue" ? pages[pageIndex].yue : pages[pageIndex].enSpeak;
    speak(lang, text, 0.8, () => {
      set({ secondLine: true, echoPhase: "repeat" });
      startRepeatListen();
    });
  }

  function go(next) {
    const started = state.mode !== null;
    const target = Math.max(started ? 1 : 0, Math.min(pages.length - 1, next));
    if (target === state.index) return;
    refs.finishing = true;
    if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
    set({ index: target, popped: null, label: null });
    const nextPage = pages[target];
    if (state.mode === "listen" && !nextPage.cover) {
      set({ secondLine: true }, false);
      speak("yue", nextPage.yue, 0.88);
    } else if (state.mode === "echo" && !nextPage.cover) {
      beginEchoPage(target, state.echoLang);
    } else {
      stopSpeak();
      render();
    }
  }

  async function startBook(nextMode) {
    refs.finishing = true;
    if (refs.raf) { cancelAnimationFrame(refs.raf); refs.raf = 0; }
    clearClip();
    set({ mode: nextMode, index: 1, popped: null, label: null, echoPhase: "listen", hasClip: false });
    if (nextMode === "listen") {
      stopTracks();
      set({ micStatus: "off", secondLine: true }, false);
      speak("yue", pages[1].yue, 0.88);
    } else {
      await ensureMic();
      beginEchoPage(1, state.echoLang);
    }
  }

  function goCover() {
    refs.finishing = true;
    stopSpeak();
    stopListenLoop();
    stopTracks();
    clearClip();
    set({ mode: null, index: 0, echoPhase: "listen", micStatus: "off", popped: null, label: null, hasClip: false, secondLine: false });
  }

  function changeEchoLang(lang) {
    state.echoLang = lang;
    if (state.mode === "echo" && state.index > 0) beginEchoPage(state.index, lang);
    else render();
  }

  function replayModel() {
    if (state.mode === "echo") beginEchoPage(state.index, state.echoLang);
    else speak("yue", pages[state.index].yue, 0.88);
  }

  async function retryMic() {
    refs.micPromise = null;
    stopTracks();
    const ok = await ensureMic();
    if (ok && state.mode === "echo" && state.echoPhase === "repeat") startRepeatListen();
    render();
  }

  function popSpot(id) {
    set({ popped: id });
    setTimeout(() => { if (state.popped === id) set({ popped: null }); }, 700);
  }

  function onSpotClick(spot) {
    popSpot(spot.id);
    const lang = state.mode === "echo" ? state.echoLang : (state.playing === "en" ? "en" : "yue");
    set({ label: { id: spot.id, text: lang === "yue" ? spot.yue : spot.en } });
    setTimeout(() => { if (state.label && state.label.id === spot.id) set({ label: null }); }, 1100);
    if (state.mode === "echo" && (state.echoPhase === "listen" || state.echoPhase === "repeat" || state.echoPhase === "replay")) return;
    speak(lang, lang === "yue" ? spot.yue : spot.en, 0.95);
  }

  function onStageClick() {
    if (refs.swiped) { refs.swiped = false; return; }
    const el = document.getElementById("stage");
    if (el && el.animate) {
      el.animate([{ transform: "scale(1)" }, { transform: "scale(1.02)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
    }
    if (state.mode === "echo" && (state.echoPhase === "listen" || state.echoPhase === "repeat" || state.echoPhase === "replay")) return;
    const page = pages[state.index];
    const lang = state.mode === "echo" ? state.echoLang : (state.playing === "en" ? "en" : "yue");
    speak(lang, lang === "yue" ? page.yue : page.enSpeak, 0.95);
  }

  function updateWave() {
    const root = document.getElementById("wave");
    if (!root) return;
    const bars = root.querySelectorAll("span");
    bars.forEach((el, i) => {
      const h = waveScale[i];
      el.style.height = Math.max(8, Math.round(8 + h * state.level * 28)) + "px";
    });
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }

  function overlayHTML(page) {
    let fx = "";
    if (page.fx === "petals") {
      fx = petals.map((p, i) => `<span class="petal" style="left:${p.left}%;width:${p.size}px;height:${p.size}px;background:${p.color};animation-delay:${p.delay}ms"></span>`).join("");
    } else if (page.fx === "stars") {
      fx = stars.map((s) => `<span class="star" style="left:${s.left}%;top:${s.top}%;width:${s.size}px;height:${s.size}px;animation-delay:${s.delay}ms"></span>`).join("");
    } else if (page.fx === "sun") {
      fx = `<span class="sun"></span>`;
    }
    const spots = page.spots.map((spot) => {
      const motion = spot.motion ? spot.motion : "";
      const hint = spot.hint !== false ? `<span class="hint"></span>` : "";
      return `<button type="button" class="spot ${motion}" data-spot="${esc(spot.id)}" aria-label="${esc(spot.yue)}" style="left:${spot.left}%;top:${spot.top}%;width:${spot.width}%;height:${spot.height}%;">${hint}</button>`;
    }).join("");
    return `<div id="overlays">${fx}${spots}</div><div id="sparks"></div>`;
  }

  function syncSpotUi() {
    const stage = document.getElementById("stage");
    if (!stage) return;
    stage.querySelectorAll("[data-spot]").forEach((btn) => {
      const id = btn.getAttribute("data-spot");
      btn.classList.toggle("pop", state.popped === id);
      let tag = btn.querySelector(".nametag");
      if (state.label && state.label.id === id) {
        if (!tag) {
          tag = document.createElement("span");
          tag.className = "nametag";
          btn.appendChild(tag);
        }
        tag.textContent = state.label.text;
      } else if (tag) {
        tag.remove();
      }
    });
    const page = pages[state.index];
    const wantSparks = state.echoPhase === "praise" && state.mode === "echo" && !page.cover;
    let sparks = document.getElementById("sparks");
    if (!sparks) return;
    const html = wantSparks
      ? [0,1,2,3,4].map((i) => `<span class="spark" style="left:${18 + i * 16}%;top:${10 + (i % 2) * 8}%;width:12px;height:12px;animation-delay:${i * 180}ms"></span>`).join("")
      : "";
    if (sparks.innerHTML !== html) sparks.innerHTML = html;
  }

  function panelHTML() {
    const page = pages[state.index];
    const onCover = !!page.cover;
    const last = state.index === pages.length - 1;
    const showEnFirst = state.mode === "echo" && state.echoLang === "en";
    const zhActive = state.playing === "yue";
    const enActive = state.playing === "en";

    const zhLine = `<div class="line${zhActive ? " active" : ""}">${esc(page.zh)}</div>`;
    const enLine = `<div class="line${enActive ? " active" : ""}" style="font-size:20px">${esc(page.en)}</div>`;
    const spacer = `<div class="line" style="visibility:hidden;font-size:20px">.</div>`;
    let lines = "";
    if (!onCover) {
      if (showEnFirst) lines = enLine + (state.secondLine ? zhLine : spacer);
      else lines = zhLine + ((state.mode !== "echo" || state.secondLine || state.echoLang === "en") ? enLine : spacer);
    }

    if (onCover) {
      return `<div class="center">
        <div class="title">小熊去公園</div>
        <div class="sub">Little Bear Goes to the Park</div>
        <div class="hint-text">成幅圖都可以撳，聽同玩</div>
        <button type="button" class="btn primary" data-act="listen">聽故事</button>
        <button type="button" class="btn teal" data-act="echo">跟讀</button>
      </div>`;
    }

    let head = "";
    if (state.mode === "echo") {
      head = `<div class="row">
          <button type="button" class="btn${state.echoLang === "yue" ? " on" : ""}" data-act="lang-yue" style="flex:1 1 140px;max-width:200px">粵語</button>
          <button type="button" class="btn${state.echoLang === "en" ? " on" : ""}" data-act="lang-en" style="flex:1 1 140px;max-width:200px">English</button>
        </div>`;
    } else {
      head = `<div class="hint-text">撳圖裡面任何地方，都可以聽同玩</div>`;
    }
    let phase = "";
    if (state.mode === "echo" && state.echoPhase === "repeat") {
      const wave = state.micStatus === "on"
        ? `<div class="wave" id="wave">${waveScale.map((h) => `<span style="height:${Math.max(8, Math.round(8 + h * state.level * 28))}px"></span>`).join("")}</div>`
        : "";
      let hint;
      if (state.micStatus === "on") hint = "讀完會自動聽返你；亦可以撳「我讀完喇」";
      else if (!window.isSecureContext) hint = "請用 Chrome 打開呢個網頁，先可以開咪高峰。而家可以撳「我讀完喇」。";
      else hint = "開唔到咪高峰，讀完請撳「我讀完喇」。亦可撳「再開咪」。";
      const retry = state.micStatus !== "on" && window.isSecureContext
        ? `<button type="button" class="btn" data-act="retry-mic" style="min-height:44px;font-size:16px">再開咪</button>`
        : "";
      phase = `<div class="center" style="gap:8px"><div class="phase">而家你讀</div>${wave}<div class="hint-text">${hint}</div>${retry}</div>`;
    } else if (state.mode === "echo" && state.echoPhase === "replay") {
      phase = `<div class="phase">聽返你自己</div>`;
    } else if (state.mode === "echo" && state.echoPhase === "praise") {
      phase = `<div class="phase big">好棒！</div>`;
    }

    let actions = "";
    if (state.mode === "listen") {
      actions = `<div class="row">
          <button type="button" class="btn${state.playing === "yue" ? " on" : ""}" data-act="speak-yue" style="flex:1 1 140px;max-width:200px">粵語</button>
          <button type="button" class="btn${state.playing === "en" ? " on" : ""}" data-act="speak-en" style="flex:1 1 140px;max-width:200px">English</button>
        </div>`;
    }
    if (state.mode === "echo" && state.echoPhase === "repeat") {
      actions += `<div class="row">
          <button type="button" class="btn" data-act="replay-model" style="flex:1 1 140px;max-width:200px">再聽一次</button>
          <button type="button" class="btn primary" data-act="done" style="flex:1 1 140px;max-width:220px">我讀完喇</button>
        </div>`;
    }
    if (state.mode === "echo" && state.echoPhase === "praise") {
      actions += `<div class="row">
          ${state.hasClip ? `<button type="button" class="btn${state.playing === "clip" ? " on" : ""}" data-act="play-clip" style="flex:1 1 140px;max-width:200px">聽返自己</button>` : ""}
          <button type="button" class="btn" data-act="replay-model" style="flex:1 1 140px;max-width:200px">再聽一次</button>
          ${last
            ? `<button type="button" class="btn primary" data-act="echo-again" style="flex:1 1 140px;max-width:220px">再讀一次</button>`
            : `<button type="button" class="btn primary" data-act="next" style="flex:1 1 140px;max-width:220px">下一頁</button>`}
        </div>`;
    }
    if (state.mode === "listen" && last) {
      actions += `<div class="row"><button type="button" class="btn primary" data-act="listen-again">再睇一次</button></div>`;
    }

    const dots = pages.slice(1).map((_, i) => `<i class="${i + 1 === state.index ? "cur" : ""}"></i>`).join("");
    return `<div class="panel">${head}${phase}${lines}${actions}
        <div class="row">
          <button type="button" class="btn nav" data-act="prev" ${state.index <= 1 ? "disabled" : ""}>‹</button>
          <div class="dots">${dots}</div>
          <button type="button" class="btn nav" data-act="next" ${last ? "disabled" : ""}>›</button>
        </div>
        <div class="row"><button type="button" class="btn" data-act="cover" style="min-height:44px;font-size:16px">封面</button></div>
      </div>`;
  }

  function render() {
    const page = pages[state.index];
    const appEl = document.getElementById("app");
    const stage = document.getElementById("stage");
    const samePage = stage && stage.getAttribute("data-index") === String(state.index);
    const mid = panelHTML();

    if (!samePage) {
      const stageHtml = `<div class="stage-wrap enter" id="stage" data-index="${state.index}">
        <img src="${esc(page.img)}" alt="${esc(page.alt)}" draggable="false">
        ${overlayHTML(page)}
      </div>`;
      const panel = document.getElementById("panel");
      if (stage && panel) {
        stage.outerHTML = stageHtml;
        panel.innerHTML = mid;
      } else {
        appEl.innerHTML = `${stageHtml}<div id="panel">${mid}</div>`;
      }
    } else {
      document.getElementById("panel").innerHTML = mid;
    }
    syncSpotUi();
  }

  const app = document.getElementById("app");
  app.addEventListener("pointerdown", (e) => {
    if (!e.target.closest("#stage")) return;
    refs.swiped = false;
    refs.touchX = e.clientX;
  });
  app.addEventListener("pointerup", (e) => {
    if (refs.touchX == null || state.mode === null) { refs.touchX = null; return; }
    if (!e.target.closest("#stage") && !refs.swiped) { refs.touchX = null; return; }
    const dx = e.clientX - refs.touchX;
    refs.touchX = null;
    if (dx < -50) { refs.swiped = true; go(state.index + 1); }
    else if (dx > 50) { refs.swiped = true; go(state.index - 1); }
  });
  app.addEventListener("click", (e) => {
    const spotBtn = e.target.closest("[data-spot]");
    if (spotBtn) {
      e.preventDefault();
      e.stopPropagation();
      if (refs.swiped) { refs.swiped = false; return; }
      const spot = pages[state.index].spots.find((s) => s.id === spotBtn.getAttribute("data-spot"));
      if (spot) onSpotClick(spot);
      return;
    }
    if (e.target.closest("#stage")) {
      onStageClick();
      return;
    }
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.getAttribute("data-act");
    if (act === "listen") void startBook("listen");
    else if (act === "echo") void startBook("echo");
    else if (act === "lang-yue") changeEchoLang("yue");
    else if (act === "lang-en") changeEchoLang("en");
    else if (act === "speak-yue") speak("yue", pages[state.index].yue, 0.88);
    else if (act === "speak-en") speak("en", pages[state.index].enSpeak, 0.88);
    else if (act === "replay-model") replayModel();
    else if (act === "done") void finishRepeat();
    else if (act === "play-clip") playClip();
    else if (act === "echo-again") void startBook("echo");
    else if (act === "listen-again") void startBook("listen");
    else if (act === "prev") go(state.index - 1);
    else if (act === "next") go(state.index + 1);
    else if (act === "cover") goCover();
    else if (act === "retry-mic") void retryMic();
  });

  app.addEventListener("pointerdown", (e) => {
    const spotBtn = e.target.closest("[data-spot]");
    if (spotBtn) e.stopPropagation();
  }, true);

  if (typeof speechSynthesis !== "undefined") {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener("voiceschanged", () => { speechSynthesis.getVoices(); });
  }
  render();
})();
  </script>
</body>
</html>
